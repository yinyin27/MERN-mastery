<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <section id="navbar">
          <div class="nav">
            <div class="logo">
              <h3><a href="#">yinyin</a></h3>
            </div>
            <div class="fs_button">
              <button id="fullScreenBtn" class="clean-btn">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  fill="currentColor"
                  class="bi bi-fullscreen"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M1.5 1a.5.5 0 0 0-.5.5v4a.5.5 0 0 1-1 0v-4A1.5 1.5 0 0 1 1.5 0h4a.5.5 0 0 1 0 1zM10 .5a.5.5 0 0 1 .5-.5h4A1.5 1.5 0 0 1 16 1.5v4a.5.5 0 0 1-1 0v-4a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 1-.5-.5M.5 10a.5.5 0 0 1 .5.5v4a.5.5 0 0 0 .5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 0 14.5v-4a.5.5 0 0 1 .5-.5m15 0a.5.5 0 0 1 .5.5v4a1.5 1.5 0 0 1-1.5 1.5h-4a.5.5 0 0 1 0-1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 1 .5-.5"
                  />
                </svg>
              </button>
            </div>
          </div>
        </section>
      </header>
      <main>
        <section class="Hero">
          <div class="frame">
            <h1>Counter</h1>
            <p>Everything is a Count!</p>
          </div>
        </section>
        <section id="app">
          <div class="Counter">
            <p id="CounterText">0</p>
          </div>
          <div class="Btns">
            <button id="inc-btn">increment</button>
            <button id="dec-btn">decrement</button>
            <button id="reset-btn">reset</button>
          </div>
          <div class="error">
            <p id="msg">Count can't be negative! Increment first.</p>
          </div>
        </section>
      </main>
      <footer>
        <p>Copyright © 2026 yinyin27 | All Rights Reserved.</p>
      </footer>
    </div>
    <script src="app.js"></script>
  </body>
</html>
