<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Contrail+One&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />

    <!-- /fonts -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
  </head>
  <body
    class="min-h-screen bg-gray-50 flex flex-col justify-center items-center"
  >
    <div
      class="hero px-2 rounded-2xl py-6 bg-blue-100 w-full max-w-xs flex flex-col justify-center items-center shadow-xl gap-5"
    >
      <h1 class="text-3xl main-font text-blue-900">Expense Tracker</h1>
      <div class="form">
        <form
          id="add-txn-form"
          class="rounded-xl shadow-sm pl-4 py-4 pr-1 flex flex-col flex-1 gap-y-3 bg-linear-to-tr from-90% from-blue-50 via-blue-100 to to-blue-800 to-5% justify-center items-baseline"
        >
          <div>
            <h2 class="font-PatrickHand text-xl font-semibold tracking-wider">
              Add a transaction
            </h2>
          </div>
          <div class="name">
            <label for="txn-name" class="form-font text-md tracking-wider">
              Name:
            </label>
            <input
              type="text"
              name="name"
              id="txn-name"
              placeholder="Enter expense name"
              class="font-mono text-md px-1 space-x-1 focus:outline-0 border-b"
            />
          </div>
          <div class="Amount">
            <label for="txn-amt" class="form-font text-md tracking-wider"
              >Amount:</label
            >
            <input
              type="number"
              step="0.01"
              name="name"
              id="txn-amt"
              placeholder="Enter amount"
              class="font-mono text-md px-1 space-x-1 focus:outline-0 border-b"
            />
          </div>
          <div class="tr-type flex w-full gap-3 justify-baseline items-center">
            <p class="form-font text-md tracking-wider hover:cursor-default">
              Type:
            </p>
            <div class="space-x-1">
              <input type="radio" name="expenseType" id="credit" />
              <label for="credit" class="font-mono text-md tracking-wider"
                >Credit
              </label>
            </div>
            <div class="space-x-1">
              <input type="radio" name="expenseType" id="debit" />
              <label for="debit" class="font-mono text-md tracking-wider"
                >Debit
              </label>
            </div>
          </div>
          <div>
            <label for="timestamp" class="form-font text-md tracking-wider"
              >Date:
            </label>
            <input
              type="date"
              name="date"
              id="timestamp"
              placeholder="Enter Date & time"
              class="font-mono text-md px-1 space-x-1 focus:outline-0 border-b"
            />
          </div>
          <div class="pt-3 flex w-[90%] justify-center items-center">
            <input
              type="submit"
              name="Submit"
              id="add-txn-btn"
              value="Add"
              class="rounded-full shadow-xs shadow-blue-950 text-xl text-center px-5 py-1 text-white bg-blue-800 font-PatrickHand tracking-wide active:bg-blue-300 active:text-blue-950 active:font-bold active:animate-ping hover:bg-blue-950 hover:scale-105 transition-all"
            />
          </div>
        </form>
      </div>
      <div
        id="showBalance"
        class="p-3 pt-1 flex gap-4 justify-between items-center"
      >
        <!-- <p
          class="font-mono text-xl text-blue-950 text-shadow-xs text-shadow-blue-950"
        >
          10,000
        </p> -->
        <button
          id="balBtn"
          class="text-md text-center font-bold lg:font-semibold shadow-sm shadow-gray-500 border border-blue-600 bg-linear-to-br from-20% from-white via-50% via-gray-100 to-gray-200 to-100% text-black rounded-full px-3 py-1 lg:hover:-translate-y-px lg:hover:border-blue-100 active:animate-click active:border-blue-100 transition-all"
        >
          Check balance
        </button>
      </div>
      <div class="w-[96%] flex flex-col justify-center items-center gap-2">
        <h4
          class="font-PatrickHand text-bl ue-700 italic font-bold tracking-wider pt-4 pb-1 text-shadow-lg text-shadow-gray-300 text-xl"
        >
          Recent expenses
        </h4>
        <ul id="txn-list" class="w-full space-y-2.5"></ul>
        <!-- <div 
        class="w-full text-md font-bold lg:font-semibold font-mono tracking-wider py-2 border border-gray-100 rounded-2xl px-5 flex flex-1 justify-between items-center bg-linear-to-br from-20% from-white via-50% via-gray-100 to-gray-200 to-100% hover:cursor-default hover:-translate-y-0.5 hover:shadow-sm active:animate-click transition-transform"
    >
        <p class="txn-title">${txnName.value}</p>
        <p class="amt">₹${txnAmt.value}</p>
    </div> -->
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
