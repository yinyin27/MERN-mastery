<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Contrail+One&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />

    <!-- /fonts -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
  </head>
  <body
    class="min-h-screen bg-gray-50 flex flex-col justify-center items-center"
  >
    <div
      class="container px-2 rounded-2xl py-6 bg-blue-100 w-full max-w-xs flex flex-col justify-center items-center shadow-xl gap-5"
    >
      <h1 class="text-3xl main-font text-blue-900">Expense Tracker</h1>
      <div class="form">
        <form
          class="rounded-xl pl-4 py-4 pr-1 flex flex-col flex-1 gap-y-3 bg-linear-to-tr from-90% from-blue-50 via-blue-100 to to-blue-800 to-5% justify-center items-baseline"
          method="post"
        >
          <div>
            <h2 class="font-PatrickHand text-xl font-semibold tracking-wider">
              Add a transaction
            </h2>
          </div>
          <div class="name">
            <label for="name" class="form-font text-md tracking-wider">
              Name:
            </label>
            <input
              type="text"
              name="name"
              id="name"
              placeholder="Enter expense name"
              class="font-mono text-md px-1 space-x-1 focus:outline-0 border-b"
            />
          </div>
          <div class="Amount">
            <label for="amount" class="form-font text-md tracking-wider"
              >Amount:</label
            >
            <input
              type="number"
              step="0.01"
              name="name"
              id="amount"
              placeholder="Enter amount"
              class="font-mono text-md px-1 space-x-1 focus:outline-0 border-b"
            />
          </div>
          <div class="tr-type flex w-full gap-3 justify-baseline items-center">
            <label for="type" class="form-font text-md tracking-wider"
              >Type:
            </label>
            <div class="space-x-1">
              <input type="radio" name="expenseType" id="credit" />
              <label for="credit" class="font-mono text-md tracking-wider"
                >Credit
              </label>
            </div>
            <div class="space-x-1">
              <input type="radio" name="expenseType" id="debit" />
              <label for="debit" class="font-mono text-md tracking-wider"
                >Debit
              </label>
            </div>
          </div>
          <div>
            <label for="timestamp" class="form-font text-md tracking-wider"
              >Date:
            </label>
            <input
              type="date"
              name="date"
              id="timestamp"
              placeholder="Enter Date & time"
              class="font-mono text-md px-1 space-x-1 focus:outline-0 border-b"
            />
          </div>
          <div>
            <input
              type="submit"
              name="Submit"
              class="rounded-full px-3 py-1 text-white bg-blue-800 font-PatrickHand tracking-wide active:bg-blue-300 active:text-blue-950 active:font-bold active:animate-ping hover:bg-blue-950 hover:scale-105 transition-all"
            />
          </div>
        </form>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
