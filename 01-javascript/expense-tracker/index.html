<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Contrail+One&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />

    <!-- /fonts -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
  </head>
  <body
    class="min-h-screen bg-gray-50 flex flex-col justify-center items-center py-6"
  >
    <div
      class="hero px-2 rounded-2xl py-6 bg-blue-100 w-full max-w-xs flex flex-col justify-center items-center shadow-xl gap-5 md:max-w-sm lg:max-w-md xl:max-w-3xl xl:px-4"
    >
      <h1 class="text-4xl main-font text-blue-900">Expense Tracker</h1>
      <div class="px-4 w-full flex justify-center items-center">
        <form
          id="add-txn-form"
          class="w-full rounded-xl shadow-sm px-4 py-4 flex flex-col flex-1 justify-center items-center gap-y-3 bg-linear-to-tr from-90% from-blue-50 via-blue-100 to to-blue-800 to-5%"
        >
          <div class="w-full">
            <h2 class="font-PatrickHand text-2xl font-semibold tracking-wider">
              Add a transaction
            </h2>
          </div>
          <div
            id="add-txn-drop-down"
            class="w-full flex flex-col flex-1 justify-center items-baseline gap-y-3 xl:grid-cols-2 xl:grid xl:gap-y-6 xl:pt-2 xl:max-w-2xl"
          >
            <div class="name xl:flex xl:flex-col xl:gap-x-1">
              <label
                for="txn-name"
                class="form-font text-md tracking-wider md:text-lg lg:text-xl"
              >
                Name:
              </label>
              <input
                type="text"
                name="name"
                id="txn-name"
                required
                placeholder="Enter expense name"
                class="font-mono text-md px-1 space-x-1 focus:outline-0 border-b xl:w-[88%] md:text-lg lg:text-xl"
              />
            </div>
            <div class="Amount xl:flex xl:flex-col xl:gap-x-1">
              <label
                for="txn-amt"
                class="form-font text-md tracking-wider md:text-lg lg:text-xl"
                >Amount:</label
              >
              <input
                type="number"
                step="0.01"
                name="name"
                required
                id="txn-amt"
                placeholder="Enter amount"
                class="font-mono text-md px-1 space-x-1 focus:outline-0 border-b xl:w-[88%] md:text-lg lg:text-xl"
              />
            </div>
            <div
              class="tr-type flex w-full gap-3 justify-baseline items-center xl:w-[88%]"
            >
              <p
                class="form-font text-md tracking-wider hover:cursor-default md:text-lg lg:text-xl"
              >
                Type:
              </p>
              <div
                class="space-x-1 xl:flex xl:flex-col xl:justify-center xl:items-center xl:gap-y-1"
              >
                <input
                  type="radio"
                  value="credit"
                  required
                  name="expenseType"
                  id="credit"
                />
                <label
                  for="credit"
                  class="font-mono text-md tracking-wider md:text-lg lg:text-xl"
                  >Credit
                </label>
              </div>
              <div
                class="space-x-1 xl:flex xl:flex-col xl:justify-center xl:items-center xl:gap-y-1"
              >
                <input
                  type="radio"
                  value="debit"
                  name="expenseType"
                  id="debit"
                />
                <label
                  for="debit"
                  class="font-mono text-md tracking-wider md:text-lg lg:text-xl"
                  >Debit
                </label>
              </div>
            </div>
            <div>
              <label
                for="timestamp"
                class="form-font text-md tracking-wider md:text-lg lg:text-xl"
                >Date:
              </label>
              <input
                type="date"
                name="date"
                id="timestamp"
                placeholder="Enter Date & time"
                class="font-mono text-md px-1 space-x-1 focus:outline-0 border-b"
              />
            </div>
            <div
              class="pt-3 flex w-[90%] justify-end items-center xl:col-span-2"
            >
              <input
                type="submit"
                name="Submit"
                id="add-txn-btn"
                value="Add"
                class="rounded-2xl shadow-xs shadow-blue-950 text-xl text-center px-8 py-2 text-white bg-blue-800 font-PatrickHand tracking-wide active:bg-blue-300 active:text-blue-950 active:font-bold active:animate-ping hover:bg-blue-950 hover:scale-105 transition-all md:text-2xl"
              />
            </div>
          </div>
        </form>
      </div>

      <div
        id="txn-list-container"
        class="w-[96%] flex flex-col justify-center items-center gap-2"
      >
        <h4
          class="font-PatrickHand text-bl ue-700 font-bold tracking-wider pt-4 pb-1 text-shadow-lg text-shadow-gray-300 text-xl md:text-2xl"
        >
          Recent expenses
        </h4>
        <ul id="txn-list" class="w-full space-y-2.5"></ul>
        <!-- <div 
        class="w-full text-md font-bold lg:font-semibold font-mono tracking-wider py-2 border border-gray-100 rounded-2xl px-5 flex flex-1 justify-between items-center bg-linear-to-br from-20% from-white via-50% via-gray-100 to-gray-200 to-100% hover:cursor-default hover:-translate-y-0.5 hover:shadow-sm active:animate-click transition-transform"
    >
        <p class="txn-title">${txnName.value}</p>
        <p class="amt">₹${txnAmt.value}</p>
    </div> -->
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
